name: CI

on:
  push:
    branches: [main, dev, chore/update-dev-dependencies-20261020]
  pull_request:
    branches: [main, dev]

permissions:
  contents: write

jobs:
  dependency-update:
    if: github.event_name == 'pull_request' && github.event.pull_request.number == 28
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: chore/update-dev-dependencies-20261020
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: yarn
      - run: yarn upgrade --latest
      - run: yarn lint
      - run: yarn test
      - run: yarn build
      - run: npx --yes @arethetypeswrong/cli --pack .
      - name: Commit verified dependencies
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add package.json yarn.lock
          if ! git diff --cached --quiet; then
            git commit -m 'chore: update verified development dependencies'
            git push
          fi

  test:
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        # eslint@10 requires ^20.19.0 || ^22.13.0 || >=24
        node-version: [20, 22, 24]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: yarn

      - run: yarn install --frozen-lockfile

      - run: yarn lint

      - run: yarn test

      - run: yarn build

      - name: Check package types (arethetypeswrong)
        if: matrix.node-version == 22
        run: npx --yes @arethetypeswrong/cli --pack .
